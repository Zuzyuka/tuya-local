name: Voltage and current protector with metering
# Built from the Tuya data model (modelId e2x1ac).
products:
  - id: a7wqcew7sx3rpsao
    manufacturer: GEYA
    model: GPS8-06 63A
entities:
  # ---- DP 1 forward_energy_total ----
  - entity: sensor
    class: energy
    dps:
      - id: 1
        type: integer
        name: sensor
        unit: kWh
        class: total_increasing
        optional: true
        mapping:
          - scale: 100
  # ---- DP 6 phase_a ----
  #   8 bytes, big-endian: voltage 2 bytes (0.1 V), current 3 bytes (0.001 A), power 3 bytes (0.001 kW)
  #   The meter reports on its own interval; `force: true` makes Tuya Local
  #   request DP 6 explicitly on every poll.
  - entity: sensor
    class: voltage
    dps:
      - id: 6
        type: base64
        name: sensor
        unit: V
        class: measurement
        optional: true
        force: true
        mask: "FFFF000000000000"
        mapping:
          - scale: 10
  - entity: sensor
    class: current
    dps:
      - id: 6
        type: base64
        name: sensor
        unit: A
        class: measurement
        optional: true
        force: true
        mask: "0000FFFFFF000000"
        mapping:
          - scale: 1000
  - entity: sensor
    class: power
    dps:
      - id: 6
        type: base64
        name: sensor
        unit: kW
        class: measurement
        optional: true
        force: true
        mask: "0000000000FFFFFF"
        mapping:
          - scale: 1000
  # ---- DP 10 fault ----
  - entity: binary_sensor
    name: Fault code
    class: problem
    category: diagnostic
    dps:
      - id: 10
        type: bitfield
        name: sensor
        optional: true
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 10
        type: bitfield
        name: fault_code
      - id: 10
        type: bitfield
        name: description
        mapping:
          - dps_val: 0
            value: ok
          - dps_val: 1
            value: ov_cr
          - dps_val: 2
            value: unbalance_alarm
          - dps_val: 4
            value: ov_vol
          - dps_val: 8
            value: undervoltage_alarm
          - dps_val: 16
            value: miss_phase_alarm
          - dps_val: 32
            value: outage_alarm
          - dps_val: 64
            value: magnetism_alarm
          - dps_val: 128
            value: terminal_alarm
          - dps_val: 256
            value: cover_alarm
          - dps_val: 512
            value: credit_alarm
          - dps_val: 1024
            value: no_balance_alarm
          - dps_val: 2048
            value: battery_alarm
          - dps_val: 4096
            value: meter_hardware_alarm
  # ---- DP 16 switch ----
  - entity: switch
    dps:
      - id: 16
        type: boolean
        name: switch
  # ---- DP 17 alarm_set_2 ----
  #   12 bytes = 3 blocks of 4 bytes: [type][enabled][threshold hi][threshold lo]
  #   Real value: AQEAPwMBAQkEAQC5 = 01 01 00 3F 03 01 01 09 04 01 00 B9
  #     01 over-current   enabled, 63 A  (range 1-63 A)
  #     03 over-voltage   enabled, 265 V (range 230-300 V)
  #     04 under-voltage  enabled, 185 V (range 140-210 V)
  #   A mask must be exactly as long as the raw value (12 bytes here).
  - entity: sensor
    name: Alarm set 2
    category: diagnostic
    dps:
      - id: 17
        type: string #base64
        name: sensor
        optional: true
        force: true
  - entity: switch
    name: Over-current protection
    category: config
    dps:
      - id: 17
        type: base64
        name: switch
        optional: true
        mask: "00FF00000000000000000000"
  - entity: number
    name: Over-current limit
    mode: box
    class: current
    category: config
    dps:
      - id: 17
        type: base64
        name: value
        optional: true
        mask: "0000FFFF0000000000000000"
        unit: A
        range:
          min: 1
          max: 63
  - entity: switch
    name: Over-voltage protection
    category: config
    dps:
      - id: 17
        type: base64
        name: switch
        optional: true
        mask: "0000000000FF000000000000"
  - entity: number
    name: Over-voltage limit
    mode: box
    class: voltage
    category: config
    dps:
      - id: 17
        type: base64
        name: value
        optional: true
        mask: "000000000000FFFF00000000"
        unit: V
        range:
          min: 230
          max: 300
  - entity: switch
    name: Under-voltage protection
    category: config
    dps:
      - id: 17
        type: base64
        name: switch
        optional: true
        mask: "000000000000000000FF0000"
  - entity: number
    name: Under-voltage limit
    mode: box
    class: voltage
    category: config
    dps:
      - id: 17
        type: base64
        name: value
        optional: true
        mask: "00000000000000000000FFFF"
        unit: V
        range:
          min: 140
          max: 210
  # ---- DP 20 clear_event ----
  #   Master clear command. Effect not documented: comment out if not needed.
  - entity: button
    name: Master clear
    category: config
    hidden: true
    dps:
      - id: 20
        type: boolean
        name: button
        optional: true