name: Circuit breaker energy meter
products:
  - id: 2ipujbjoxbznmdwz
    manufacturer: TOMZN
    model: TOMPD-63SF
entities:
  # ---------------------------------------------------------------------------
  # Main breaker switch (DP 16). DP 6/17/18 raw attributes are disabled;
  # DP 17/18 are exposed below as raw sensors, masked entities and presets.
  # ---------------------------------------------------------------------------
  - entity: switch
    dps:
      - id: 16
        type: boolean
        name: switch
        mapping:
          - dps_val: true
            value: "On"
          - dps_val: false
            value: "Off"
      #- id: 6
      #  type: base64
      #  name: phase_a
      #  readonly: true
      #  optional: true
      #- id: 17
      #  type: base64
      #  name: alarm_set_1
      #  optional: true
      #- id: 18
      #  type: base64
      #  name: alarm_set_2
      #  optional: true
      #- id: 19
      #  type: string
      #  name: breaker_id
      #  readonly: true
      #  sensitive: true
      #  optional: true
  # ------------------------------- Measurements ------------------------------
  - entity: sensor
    class: energy
    dps:
      - id: 1
        type: integer
        name: sensor
        unit: kWh
        class: total_increasing
        optional: true
        mapping:
          - scale: 100
  - entity: sensor
    class: voltage
    dps:
      - id: 6
        type: base64
        name: sensor
        unit: V
        class: measurement
        optional: true
        mask: "FFFF000000000000"
        mapping:
          - scale: 10
  - entity: sensor
    class: current
    dps:
      - id: 6
        type: base64
        name: sensor
        unit: A
        class: measurement
        optional: true
        mask: "0000FFFFFF000000"
        mapping:
          - scale: 1000
  - entity: sensor
    class: power
    dps:
      - id: 6
        type: base64
        name: sensor
        unit: kW
        class: measurement
        optional: true
        mask: "0000000000FFFFFF"
        mapping:
          - scale: 1000
  # --------------------------------- Faults ----------------------------------
  - entity: binary_sensor  # fault -9- bitmap
    name: Fault code
    class: problem
    category: diagnostic
    dps:
      - id: 9
        type: bitfield
        name: sensor
        optional: true
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 9
        type: bitfield
        name: fault_code
      - id: 9
        type: bitfield
        name: description
        mapping:
          - dps_val: 0
            value: ok
          - dps_val: 1
            value: short_circuit_alarm
          - dps_val: 2
            value: surge_alarm
          - dps_val: 4
            value: overload_alarm
          - dps_val: 8
            value: leakagecurr_alarm
          - dps_val: 16
            value: temp_dif_fault
          - dps_val: 32
            value: fire_alarm
          - dps_val: 64
            value: high_power_alarm
          - dps_val: 128
            value: self_test_alarm
          - dps_val: 256
            value: ov_cr
          - dps_val: 512
            value: unbalance_alarm
          - dps_val: 1024
            value: ov_vol
          - dps_val: 2048
            value: undervoltage_alarm
          - dps_val: 4096
            value: miss_phase_alarm
          - dps_val: 8192
            value: outage_alarm
          - dps_val: 16384
            value: magnetism_alarm
          - dps_val: 32768
            value: credit_alarm
          - dps_val: 65536
            value: no_balance_alarm
  # ------------------------------- Prepayment --------------------------------
  - entity: switch
    name: Prepayment
    category: config
    hidden: true
    dps:
      - id: 11
        type: boolean
        name: switch
        optional: true
  - entity: button
    name: Clear remaining energy
    category: config
    hidden: true
    dps:
      - id: 12
        type: boolean
        name: button
        optional: true
  - entity: sensor
    name: Balance energy
    class: energy_storage
    category: diagnostic
    dps:
      - id: 13
        type: integer
        name: sensor
        unit: kWh
        class: measurement
        optional: true
        mapping:
          - scale: 10
  - entity: number
    name: Charge energy
    class: energy_storage
    category: config
    hidden: true
    dps:
      - id: 14
        type: integer
        name: value
        unit: kWh
        optional: true
        range:
          min: 0
          max: 99999
        mapping:
          - scale: 10
  - entity: sensor
    name: Leakage current
    translation_key: leakage_current
    class: current
    category: diagnostic
    dps:
      - id: 15
        type: integer
        name: sensor
        unit: mA
        class: measurement
        optional: true
  - entity: sensor
    name: Alarm set 1
    translation_key: alarm_set_1_raw
    category: diagnostic
    dps:
      - id: 17
        type: string #base64
        name: sensor
        optional: true
        force: true
  - entity: sensor
    name: Alarm set 2
    translation_key: alarm_set_2_raw
    category: diagnostic
    dps:
      - id: 18
        type: string #base64
        name: sensor
        optional: true
        force: true
  # ---------------------------------------------------------------------------
  # DP 17: Leakage protection (4 bytes: [type=04][enabled][value hi][value lo])
  # Writes only touch the masked bytes; the type byte is preserved from cache.
  # ---------------------------------------------------------------------------
  - entity: switch
    name: Leakage current protection
    translation_key: leakage_current_protection
    category: config
    dps:
      - id: 17
        type: base64
        name: switch
        optional: true
        mask: "00FF0000"
  - entity: number
    name: Leakage current limit
    translation_key: leakage_current_protection_limit
    mode: box
    class: current
    category: config
    dps:
      - id: 17
        type: base64
        name: value
        optional: true
        mask: "0000FFFF"
        unit: mA
        range:
          min: 10
          max: 30
  # ---------------------------------------------------------------------------
  # DP 18: three 4-byte blocks [type][enabled][value hi][value lo]
  #   block 1 (type 01) over-current, block 2 (type 03) over-voltage,
  #   block 3 (type 04) under-voltage
  # ---------------------------------------------------------------------------
  - entity: switch
    name: Over-current protection
    translation_key: over_current_protection
    category: config
    dps:
      - id: 18
        type: base64
        name: switch
        optional: true
        mask: "00FF00000000000000000000"
  - entity: number
    name: Over-current limit
    translation_key: over_current_protection_limit
    mode: box
    class: current
    category: config
    dps:
      - id: 18
        type: base64
        name: value
        optional: true
        mask: "0000FFFF0000000000000000"
        unit: A
        # add limit according to the model of breaker 40/63/80 A
        range:
          min: 1
          max: 63
  - entity: switch
    name: Over-voltage protection
    translation_key: over_voltage_protection
    category: config
    dps:
      - id: 18
        type: base64
        name: switch
        optional: true
        mask: "0000000000FF000000000000"
  - entity: number
    name: Over-voltage limit
    translation_key: over_voltage_protection_limit
    mode: box
    class: voltage
    category: config
    dps:
      - id: 18
        type: base64
        name: value
        optional: true
        mask: "000000000000FFFF00000000"
        unit: V
        range:
          min: 100
          max: 300
  - entity: switch
    name: Under-voltage protection
    translation_key: under_voltage_protection
    category: config
    dps:
      - id: 18
        type: base64
        name: switch
        optional: true
        mask: "000000000000000000FF0000"
  - entity: number
    name: Under-voltage limit
    translation_key: under_voltage_protection_limit
    mode: box
    class: voltage
    category: config
    dps:
      - id: 18
        type: base64
        name: value
        optional: true
        mask: "00000000000000000000FFFF"
        unit: V
        range:
          min: 80
          max: 280
  # ---------------------------------------------------------------------------
  # Preset selects: each option writes the COMPLETE DP value, so no cached value
  # is needed. Values verified against the device (hex in comments).
  # To add an option: hex -> base64:  echo '0401001E' | xxd -r -p | base64
  # ---------------------------------------------------------------------------
  - entity: select
    name: Leakage protection preset
    category: config
    dps:
      - id: 17
        type: base64
        name: option
        optional: true
        mapping:
          - dps_val: "BAEAFA=="    # 04 01 00 14
            value: "On, 20 mA"
          - dps_val: "BAEAHg=="    # 04 01 00 1E
            value: "On, 30 mA"
          - dps_val: "BAEACg=="    # 04 01 00 0A
            value: "On, 10 mA"
  #- entity: select
  #  name: Voltage and current protection preset
  #  category: config
  #  dps:
  #    - id: 18
  #      type: base64
  #      name: option
  #      optional: true
  #      mapping:
  #        # [01 oc][03 ov][04 uv], each: type, enabled, value hi, value lo
  #       - dps_val: "AQAAKAMBAQkEAQC5"    # 01 00 00 28 03 01 01 09 04 01 00 B9
  #          value: "Over-current OFF, 40 A / 265 V / 185 V"
  #        - dps_val: "AQEAKAMBAQkEAQC5"    # 01 01 00 28 03 01 01 09 04 01 00 B9
  #          value: "Over-current ON, 40 A / 265 V / 185 V"
  # ------------------------------- Misc / config -----------------------------
  - entity: button
    name: Leakage current self-test
    category: config
    hidden: true
    dps:
      - id: 21
        type: boolean
        name: button
        optional: true
  - entity: select
    name: Power-on state
    category: config
    hidden: true
    dps:
      - id: 61
        type: string
        name: option
        optional: true
        mapping:
          - dps_val: "off"
            value: "Off"
          - dps_val: "on"
            value: "On"
          - dps_val: memory
            value: Restore previous state
  - entity: button
    name: Clear total energy
    category: config
    hidden: true
    dps:
      - id: 101
        type: boolean
        name: button
        optional: true
  - entity: sensor
    name: Power factor
    category: diagnostic
    dps:
      - id: 104
        type: integer
        name: sensor
        class: measurement
        optional: true
        mapping:
          - scale: 1000
  - entity: sensor
    name: Grid frequency
    translation_key: supply_frequency
    class: frequency
    category: diagnostic
    dps:
      - id: 105
        type: integer
        name: sensor
        unit: Hz
        class: measurement
        optional: true
        mapping:
          - scale: 10
  - entity: button
    name: Refresh sensors
    translation_key: refresh
    category: diagnostic
    dps:
      - id: 106
        type: boolean
        name: button
        optional: true